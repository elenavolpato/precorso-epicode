<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;1,600&family=Prata&display=swap"
      rel="stylesheet"
    />
    <title>Congonhas - CSS basics challenge</title>
    <style>
      body {
        margin: 0 auto;
        font-optical-sizing: auto;
        font-family: "Montserrat", sans-serif;
        font-weight: 400;
      }
      .main-section {
        padding-inline: 20px;
      }
      .image-container {
        height: 500px;
        background-image: url("https://upload.wikimedia.org/wikipedia/commons/thumb/3/3b/Igreja_Matriz_de_Nossa_Senhora_da_Concei%C3%A7%C3%A3o_2.jpg/1920px-Igreja_Matriz_de_Nossa_Senhora_da_Concei%C3%A7%C3%A3o_2.jpg");
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
      }
      h1 {
        font-family: "Prata", serif;
        font-weight: 400;
        font-size: 64px;
      }
      h3 {
        font-family: "Prata", serif;
        font-weight: 400;
        font-size: 24px;
        margin-top: 0;
      }
      h1,
      h3 {
        margin-bottom: 0;
      }
      .photographer {
        font-weight: 600;
        font-style: italic;
      }
      h6 {
        padding: 22px;
        margin-bottom: 0;
        margin-top: 56px;
        color: white;
        background: linear-gradient(to right, #8b008b, #da70d6);
        border-radius: 6px;
      }
      ul {
        list-style: none;
        padding-left: 0;
      }
      li {
        padding-block: 6px;
        padding-left: 22px;
        border-bottom: 1px solid #dfdfdf;
      }
      .related-places {
        text-decoration: none;
        color: #8b008b;
      }
      .related-places:visited {
        color: #8b008b;
      }
      footer {
        background-color: black;
        color: white;
        padding: 16px;
        text-align: center;
      }
      footer a {
        color: white;
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="main-section">
      <div class="image-container"></div>
      <h1>Congonhas</h1>
      <h3>I profeti di Aleijadinho</h3>
      <p>
        Autore:
        <a
          class="photographer"
          href="https://commons.wikimedia.org/w/index.php?title=User:Ant%C3%B4nio_Ricardo_Gomes_de_Souza&action=edit&redlink=1"
          target="_blank"
          >Antônio Ricardo Gomes de Souza</a
        >
      </p>
      <h6>Luoghi correlati</h6>
      <ul>
        <a class="related-places" href="./tiradentes.html"
          ><li>Tiradentes</li></a
        >
        <a class="related-places" href="./ouro-preto.html"
          ><li>Ouro Preto</li></a
        >
        <a class="related-places" href="./diamantina.html"
          ><li>Diamantina</li></a
        >
        <a class="related-places" href="./mariana.html"><li>Mariana</li></a>
      </ul>
    </div>
    <footer>
      <a href="./index.html">Homepage</a>
    </footer>
  </body>
</html>
