<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,600;1,600&family=Prata&display=swap"
      rel="stylesheet"
    />
    <title>Ouro Preto - CSS basics challenge</title>
    <style>
      body {
        margin: 0 auto;
        font-optical-sizing: auto;
        font-family: "Montserrat", sans-serif;
        font-weight: 400;
      }
      .main-section {
        padding-inline: 20px;
      }
      .image-container {
        height: 500px;
        background-image: url("https://upload.wikimedia.org/wikipedia/commons/thumb/4/4d/Conjunto_arquitet%C3%B4nico_e_urban%C3%ADstico_de_Ouro_Preto.JPG/1920px-Conjunto_arquitet%C3%B4nico_e_urban%C3%ADstico_de_Ouro_Preto.JPG");
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
      }
      h1 {
        font-family: "Prata", serif;
        font-weight: 400;
        font-size: 64px;
      }
      h3 {
        font-family: "Prata", serif;
        font-weight: 400;
        font-size: 24px;
        margin-top: 0;
      }
      h1,
      h3 {
        margin-bottom: 0;
      }
      .photographer {
        font-weight: 600;
        font-style: italic;
      }
      h6 {
        padding: 22px;
        margin-bottom: 0;
        margin-top: 56px;
        color: white;
        background: linear-gradient(to right, #b8860b, #ffd700);
        border-radius: 6px;
      }
      ul {
        list-style: none;
        padding-left: 0;
      }
      li {
        padding-block: 6px;
        padding-left: 22px;
        border-bottom: 1px solid #dfdfdf;
      }
      .related-places {
        text-decoration: none;
        color: #b8860b;
      }
      .related-places:visited {
        color: #b8860b;
      }
      footer {
        background-color: black;
        color: white;
        padding: 16px;
        text-align: center;
      }
      footer a {
        color: white;
        text-decoration: none;
      }
      footer a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="main-section">
      <div class="image-container"></div>
      <h1>Ouro Preto</h1>
      <h3>La città dell'oro nero</h3>
      <p>
        Autore:
        <a
          class="photographer"
          href="https://commons.wikimedia.org/w/index.php?title=User:Raquel_Mendes_Silva&action=edit&redlink=1"
          target="_blank"
          >Raquel Mendes Silva
        </a>
      </p>
      <h6>Luoghi correlati</h6>
      <ul>
        <a class="related-places" href="./tiradentes.html"
          ><li>Tiradentes</li></a
        >
        <a class="related-places" href="./diamantina.html"
          ><li>Diamantina</li></a
        >
        <a class="related-places" href="./congonhas.html"><li>Congonhas</li></a>
        <a class="related-places" href="./mariana.html"><li>Mariana</li></a>
      </ul>
    </div>
    <footer>
      <a href="./index.html">Homepage</a>
    </footer>
  </body>
</html>
